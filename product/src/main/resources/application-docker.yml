spring:
  datasource:
    url: ${PRODUCT_DB_URL:jdbc:postgresql://product-db:5432/product_db}
    username: ${PRODUCT_DB_USERNAME:product_user}
    password: ${PRODUCT_DB_PASSWORD:product_password}
  security:
    oauth2:
      resourceserver:
        jwt:
          # tokens carry iss=http://localhost:9000, so keep that as the issuer and
          # fetch the signing keys over the docker host network instead
          jwk-set-uri: ${JWT_JWK_SET_URI:http://host.docker.internal:9000/oauth2/jwks}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}