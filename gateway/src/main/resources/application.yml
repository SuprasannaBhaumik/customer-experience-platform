server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: profile-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/profile/**
        - id: address-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/address/**
        - id: order-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/orders/**
        - id: favorites-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/favorites/**
