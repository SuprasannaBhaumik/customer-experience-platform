spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: profile
              uri: http://profile:8081
              predicates:
                - Path=/api/v1/profiles/**

            - id: product
              uri: http://product:8082
              predicates:
                - Path=/api/v1/products/**

            - id: order
              uri: http://order:8083
              predicates:
                - Path=/api/v1/orders/**

            - id: favorites
              uri: http://favorites:8084
              predicates:
                - Path=/api/v1/customers/{customerId}/favorites/**

            - id: payment
              uri: http://payment:8085
              predicates:
                - Path=/api/v1/payments/**

            - id: address
              uri: http://address:8086
              predicates:
                - Path=/api/v1/address/**

authorizer:
  base-url: http://host.docker.internal:9001
