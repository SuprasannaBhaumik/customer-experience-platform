spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: profile
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/profiles/**
            - id: product
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/products/**
            - id: order
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/orders/**
            - id: favorites
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/customers/{customerId}/favorites/**
            - id: payment
              uri: http://localhost:8085
              predicates:
                - Path=/api/v1/payments/**
            - id: address
              uri: http://localhost:8086
              predicates:
                - Path=/api/v1/address/**
